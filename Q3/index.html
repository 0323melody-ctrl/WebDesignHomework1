<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3: Grid - 雜誌排版頁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="magazine-grid">
        
        <header class="block-title">
            <span class="issue-tag">專題特輯 / 台灣餐桌地景</span>
            <h1>台北之旅<br>美食與設計</h1>
        </header>

        <div class="block-hero">
            <img src="images/hero-large.jpg" alt="新一代全景" class="hero-img">
        </div>

        <blockquote class="block-pullquote">
            <p>「那不是昂貴的調味料，而是時間在鐵鍋裡收汁的聲音。」</p>
        </blockquote>

        <article class="block-body">
            <p>我這次去台北逛了新一代很喜歡這個降解美甲片的主題
吃了很多東西 牛寓的小炒牛 扭了很多扭蛋買了很多可愛的娃娃 也吃了很好吃的檸檬柚子雪花冰
出去旅遊看世界這件事情本身對我很重要
台北物價很貴，如果你沒有錢你就沒有選擇這些東西的權利
你有過體驗你會更清楚自己想要什麼生活
新一代今天生成式大便太多了很失望。</p>
            
        </article>

        <aside class="block-sidebar">
            <h3>關於本期主題</h3>
            <ul>
                <li><strong>觀測物件：</strong> 降解美甲片</li>
                <li><strong>核心觀察：</strong> 金錢就是自由</li>
               
            </ul>
        </aside>

        <figure class="block-caption">
            <img src="images/caption-small.jpg" alt="全台北最好吃義大利麵">
            <figcaption>麵體吸附滿滿醬汁一入口都是幸福的滋味。</figcaption>
        </figure>

    </div>

</body>
</html>
