<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2: Flex - 介面組件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">台北之旅</div>
        <ul class="nav-links">
            <li><a href="#">我跟誰去</a></li>
            <li><a href="#">新一代</a></li>
            <li><a href="#">牛寓</a></li>
            <li><a href="#">solo pasta</a></li>
        </ul>
        <a href="#" class="nav-cta">點我</a>
    </nav>

    <main class="card-container">
        <section class="card-row">
            
            <article class="flex-card">
                <img src="images/IMG_3211.jpeg" alt="新一代" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">B級景點</h3>
                    <p class="card-item-desc">用可愛的視覺介紹景點</p>
                </div>
            </article>

            <article class="flex-card">
                <img src="images/IMG_3214.jpeg" alt="在地食材" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">牛寓</h3>
                    <p class="card-item-desc">好吃的爆炒牛肉讓人懷疑是火鍋店還是熱炒店</p>
                </div>
            </article>

            <article class="flex-card">
                <img src="images/classicu 2026-05-24 1233246BE937187066.jpeg" alt="solo pasta" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">全台北最好吃的義大利麵</h3>
                    <p class="card-item-desc">採全預約制，提供如家一般舒適的用餐環境，重溫餐桌感動。</p>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
