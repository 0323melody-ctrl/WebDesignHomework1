<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2: Flex - 介面組件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">灶腳記憶</div>
        <ul class="nav-links">
            <li><a href="#">關於我們</a></li>
            <li><a href="#">手路菜單</a></li>
            <li><a href="#">故事專欄</a></li>
            <li><a href="#">實體店面</a></li>
        </ul>
        <a href="#" class="nav-cta">線上預約</a>
    </nav>

    <main class="card-container">
        <section class="card-row">
            
            <article class="flex-card">
                <img src="images/thumb1.jpg" alt="經典手路菜" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">經典手路菜</h3>
                    <p class="card-item-desc">承襲數十年傳統配方，每一口都是歲月沉澱下來的醇厚家鄉味。</p>
                </div>
            </article>

            <article class="flex-card">
                <img src="images/thumb2.jpg" alt="在地食材" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">嚴選在地食材</h3>
                    <p class="card-item-desc">每日清晨親自走訪在地市場，挑選最溫潤、最青翠的當季天然作物。</p>
                </div>
            </article>

            <article class="flex-card">
                <img src="images/thumb3.jpg" alt="私廚體驗" class="card-thumb">
                <div class="card-content">
                    <h3 class="card-item-title">溫馨私廚體驗</h3>
                    <p class="card-item-desc">採全預約制，提供如家一般舒適的用餐環境，重溫餐桌感動。</p>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
