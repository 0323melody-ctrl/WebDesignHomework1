<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1: Block - 垂直故事卡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="story-card">
        
        <h1 class="card-title">與室友的新一代台北之旅</h1>
        
        <p class="card-subtitle">不只有藝術的薰陶，更有美食來相伴。</p>
        
        <img src="images/main-photo.jpg" alt="餐廳:牛寓" class="card-image">
        
        <p class="card-caption">經過蔬菜燉煮火鍋，以及主廚拿手的小炒牛肉。</p>
        
        <p class="card-body">
            這是我整趟旅程最喜歡的餐廳，位置坐落於中山區的小巷內，整體單價偏高，但是每一道菜都很有水準，牛肉彷彿臉頰肉的一般軟嫩，蔬菜火鍋的湯頭帶著蔬菜的鮮甜又不失層次，我和室友都好吃到哭出來。
        </p>
        
        <p class="card-footer">拍攝於 2026年5月23日星期六晚上10:34 / 林佩蓉</p>
        
    </div>

</body>
