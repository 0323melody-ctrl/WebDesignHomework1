<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1: Block - 垂直故事卡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="story-card">
        
        <h1 class="card-title">阿嬤的灶腳與手路菜</h1>
        
        <p class="card-subtitle">那一口溫潤的黑糖控肉，承載了三代人的餐桌記憶與歲月風華。</p>
        
        <img src="images/main-photo.jpg" alt="阿嬤的手路菜" class="card-image">
        
        <p class="card-caption">圖：細火慢燉中的黑糖控肉，散發著濃郁的醬油與糖香。</p>
        
        <p class="card-body">
            每當走進廚房，看見那口泛著油光的黑鐵鍋，耳邊總會響起阿嬤熟練的翻炒聲。這道看似簡單的黑糖控肉，是阿嬤傳承了數十年的拿手好菜。它之所以特別，是因為阿嬤不用白糖，而是堅持使用台灣傳統黑糖，搭配老薑與純釀醬油，慢火細熬兩個小時。對我而言，這不僅僅是一道填飽肚子的佳餚，更是異鄉遊子心中最深刻的家鄉避風港，每當遭遇挫折，只要嚐到這口溫潤的甜鹹滋味，便能重新獲得前行的勇氣。
        </p>
        
        <p class="card-footer">拍攝於 2026年5月 / 專案設計</p>
        
    </div>

</body>
</html>
